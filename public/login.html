<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无限世界 · 进入</title>
<style>
:root{
  --bg:#14130f; --bg-2:#1b1a14; --panel:#201e17; --ink:#e8e2d0;
  --muted:#9a927c; --line:#3a352a; --accent:#c0392b; --accent-2:#e0543f;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px}
.card{width:100%;max-width:380px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:12px;padding:28px 22px}
h1{text-align:center;font-size:32px;letter-spacing:6px;margin:0 0 4px;font-weight:600;color:var(--ink)}
.sub{text-align:center;color:var(--muted);font-family:var(--sans);font-size:13px;margin:0 0 22px;letter-spacing:1px}
label{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:12px;font-family:var(--sans);font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:22px;background:var(--accent);border:1px solid var(--accent);
  color:#fff;border-radius:8px;padding:13px;font-family:var(--sans);font-size:16px;cursor:pointer}
button:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--accent-2);font-family:var(--sans);font-size:13px;margin-top:12px;
  min-height:1.2em;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>无限世界</h1>
  <p class="sub">输入访问密码，开始你的旅程</p>
  <form id="form" autocomplete="off">
    <label for="password">访问密码</label>
    <input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="6 位数字">
    <label for="name">你的名字</label>
    <input id="name" type="text" maxlength="12" autocomplete="off" placeholder="旅人">
    <button id="btn" type="submit">进入</button>
    <div id="error" class="error"></div>
  </form>
</div>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form');
  var pwd = document.getElementById('password');
  var nameInput = document.getElementById('name');
  var btn = document.getElementById('btn');
  var err = document.getElementById('error');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd.value, name: nameInput.value }),
      });
      var text = await res.text();
      var data = null;
      try { data = JSON.parse(text); } catch (_) { data = {}; }
      if (res.ok && data.ok) {
        location.href = '/';
        return;
      }
      err.textContent = (data && data.error) || ('进入失败（' + res.status + '）');
    } catch (_) {
      err.textContent = '网络错误，请重试';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
