<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无限世界</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="view-home" class="view">
    <header class="home-head">
      <h1>无限世界</h1>
      <p class="sub">一句话，开一个永不结束的世界</p>
      <div class="player-line"><span id="home-player-name"></span><a id="home-logout" class="logout-link" hidden>退出</a></div>
    </header>
    <div class="home-actions"><button id="btn-new" class="btn primary">开新世界</button></div>
    <div id="world-list" class="world-list"></div>
    <p id="world-empty" class="empty" hidden>还没有世界，先开一个吧。</p>
    <p id="home-intro" class="home-intro" hidden></p>
  </section>

  <!-- 新世界 -->
  <section id="view-new" class="view" hidden>
    <div class="bar"><button class="link" data-nav="#/">‹ 返回</button><h2>开新世界</h2></div>
    <div class="form">
      <label for="seed">世界观（一句话）</label>
      <textarea id="seed" rows="3" placeholder="例如：蒸汽朋克长安，机关兽与占星术并存，皇城地下埋着永不停歇的锅炉……"></textarea>
      <div id="presets" class="presets"></div>

      <label for="char-name">角色名</label>
      <input id="char-name" type="text" placeholder="无名旅人">
      <label for="char-appearance">形象描述</label>
      <input id="char-appearance" type="text" placeholder="一袭布衣">

      <div class="alloc-head">
        <label>属性分配（基础 5，额外 6 点，每项最多 +3）</label>
        <span id="points-left">剩余 0 点</span>
        <button id="btn-random" class="btn tiny">随机</button>
      </div>
      <div id="alloc" class="alloc"></div>
      <p class="hint">不分配也可直接创世，默认把 6 点平均加到 6 项属性上。</p>

      <button id="btn-create" class="btn primary" style="margin-top:14px">创世</button>
      <div id="creating" class="creating" hidden>世界正在成形<span class="dots">…</span></div>
    </div>
  </section>

  <!-- 游戏页 -->
  <section id="view-game" class="view" hidden>
    <header class="game-head">
      <button class="link" data-nav="#/">‹ 世界列表</button>
      <div id="g-title" class="game-head-title">无限世界</div>
      <div class="game-head-meta"><span id="g-life"></span><span id="g-turn"></span></div>
      <span id="g-player-name" class="g-player"></span>
      <button id="btn-usage" class="btn tiny" aria-expanded="false" aria-controls="usage-pop">用量</button>
      <button id="btn-panel" class="btn tiny">角色面板</button>
      <button id="btn-export" class="btn tiny">导出</button>
      <a id="g-logout" class="logout-link" hidden>退出</a>
      <div id="usage-pop" class="usage-pop" hidden></div>
    </header>
    <div class="g-subhead">
      <span id="g-place" class="g-place"></span>
      <span id="g-omen" class="omen-tag" hidden>风声渐紧</span>
      <span id="g-danger" class="danger-tag" hidden>伤势沉重</span>
    </div>
    <div id="event-banner" class="event-banner" hidden></div>
    <div class="game-body">
      <main class="stage">
        <div id="top-attrs" class="top-attrs"></div>
        <div id="stream" class="stream"></div>
        <button id="btn-undo" class="undo-btn" hidden>↶ 撤回这一步</button>
        <div class="composer">
          <div id="suggestions" class="suggestions"></div>
          <div class="composer-row">
            <textarea id="action-input" rows="2" placeholder="你要做什么？（Enter 发送，Shift+Enter 换行）"></textarea>
            <button id="btn-send" class="btn primary">发送</button>
          </div>
          <div id="pending" class="pending" hidden>世界在回应… <span id="pending-secs"></span></div>
        </div>
      </main>
      <aside id="panel" class="panel" data-open="false"></aside>
    </div>
    <div id="death-mask" class="death-mask" hidden></div>
  </section>

</div>
<div id="attr-tip" class="attr-tip" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="image-viewer" class="image-viewer" hidden></div>

<script src="/js/core.js"></script>
<script src="/js/home.js"></script>
<script src="/js/images.js"></script>
<script src="/js/game.js"></script>
<script src="/js/panels.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
